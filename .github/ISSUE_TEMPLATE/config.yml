# Disable blank issues so reporters use a template.
#
# No contact_link for "questions/ideas" here: this file is inherited verbatim
# by every public repo, and Discussions URLs are per-repo, so there is no
# single link that would work fleet-wide. Repos with Discussions enabled can
# add their own .github/ISSUE_TEMPLATE/config.yml with a repo-specific link.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability / 脆弱性の報告
    url: https://github.com/shigechika/.github/blob/main/SECURITY.md
    about: Do NOT open a public issue for security problems. See our security policy. / セキュリティ問題は公開 Issue にしないでください。セキュリティポリシー参照。
